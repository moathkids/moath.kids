name: seo-and-catalog
on:
  workflow_dispatch:
  repository_dispatch:
    types: [seo-build]
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: seo-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build product pages, sitemap and Meta catalog
        run: node scripts/build-seo.mjs
        env:
          # المفتاح publishable مخصص للنشر العلني (للقراءة فقط عبر RLS). لا تضع هنا service_role أبدًا.
          SUPABASE_URL: https://mklqjlobvvloqrygkkqx.supabase.co
          SUPABASE_KEY: sb_publishable_5ZdvTLfBuLlb_7dLgkjBjQ_W-VCubM5
          SITE_URL: https://moathkids.github.io/moath.kids
      - name: Commit changes
        run: |
          git config user.name "moathkids-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p sitemap.xml robots.txt feeds
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "seo: update product pages, sitemap and catalog"
          # إعادة محاولة عند تعارض دفع متزامن (مثلًا رفع صور من لوحة الإدارة)
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push failed, retry $i"; sleep $((i * 5))
          done
          exit 1

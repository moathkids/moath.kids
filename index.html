<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاذ كيدز | ملابس أطفال</title>
    <!-- استيراد خط عربي مميز ورايق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- مكتبة أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            direction: rtl;
            text-align: right;
        }
        /* الهيدر أو الترويسة */
        header {
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 900;
        }
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        /* المحتوى الرئيسي */
        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #444;
            font-weight: 700;
        }
        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .product-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #eee;
        }
        .product-info {
            padding: 20px;
            text-align: center;
        }
        .product-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #222;
        }
        .product-price {
            color: #e74c3c;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }
        /* زر الواتساب */
        .whatsapp-btn {
            display: inline-block;
            background-color: #25d366;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s;
            width: 100%;
            text-align: center;
        }
        .whatsapp-btn:hover {
            background-color: #20ba5a;
        }
        .whatsapp-btn i {
            margin-left: 8px;
        }
        /* تذييل الصفحة (Footer) */
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }
        .social-links {
            margin-top: 15px;
        }
        .social-links a {
            color: white;
            font-size: 1.5rem;
            margin: 0 10px;
            transition: color 0.2s;
        }
        .social-links a:hover {
            color: #feb47b;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <h1>معاذ كيدز 🧸</h1>
        <p>أرقى وأجمل ملابس الأطفال لأحلى الأوقات</p>
    </header>

    <!-- قسم المنتجات -->
    <div class="container">
        <h2 class="section-title">أحدث التشكيلات</h2>
        
        <div class="products-grid">
            <!-- المنتج الأول -->
            <div class="product-card">
                <img src="product1.jpeg" alt="ملابس أطفال" class="product-image">
                <div class="product-info">
                    <h3 class="product-title">طقم أطفال صيفي راقي</h3>
                    <div class="product-price">متوفر الآن</div>
                    <a href="https://wa.me/970590000000?text=مرحباً، أستفسر عن طقم أطفال صيفي راقي" class="whatsapp-btn" target="_blank">
                        <i class="fab fa اِسم-او-ايقونة"></i> اطلب عبر الواتساب
                    </a>
                </div>
            </div>

            <!-- المنتج الثاني -->
            <div class="product-card">
                <img src="product2.jpeg" alt="ملابس أطفال" class="product-image">
                <div class="product-info">
                    <h3 class="product-title">بدلة أطفال كيوت</h3>
                    <div class="product-price">متوفر الآن</div>
                    <a href="https://wa.me/972598904686?text=مرحباً، أستفسر عن بدلة أطفال كيوت" class="whatsapp-btn" target="_blank">
                        <i class="fab fa-whatsapp"></i> اطلب عبر الواتساب
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer>
        <p>جميع الحقوق محفوظة © 2026 - معاذ كيدز</p>
        <div class="social-links">
            <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </footer>

</body>
</html>

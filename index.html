/* ================= المتجر ================= */
var ST={data:null,list:[],shown:0,PAGE:24,viewed:false};
function buildCard(p,i,store){
  var cur=store.currency||'$',code=store.currency_code||'USD';
  var card=document.createElement('div');
  card.className='bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col justify-between';
  var img=document.createElement('img');img.src=p.image;img.alt=p.name;img.loading='lazy';img.className='w-full aspect-square object-cover bg-gray-100';
  var body=document.createElement('div');body.className='p-3 flex-1 flex flex-col justify-between';
  var top=document.createElement('div');
  var h3=document.createElement('h3');h3.className='font-bold text-base mb-1';h3.textContent=p.name;
  var pr=document.createElement('p');pr.className='text-teal-600 font-bold mb-3';pr.textContent=cur+p.price;
  top.append(h3,pr);
  var btn=document.createElement('button');btn.className='w-full bg-green-600 text-white py-2 rounded-lg font-medium hover:bg-green-700 transition';btn.textContent='طلب عبر الواتساب';
  btn.addEventListener('click',function(){
    if(window.fbq)fbq('track','InitiateCheckout',{content_name:p.name,content_ids:[String(p.id||i)],content_type:'product',value:Number(p.price)||0,currency:code});
    var msg='مرحباً، أرغب في طلب هذا المنتج:\n*'+p.name+'*\nالسعر: '+cur+p.price;
    window.open('https://wa.me/'+store.whatsapp+'?text='+encodeURIComponent(msg),'_blank');
  });
  body.append(top,btn);card.append(img,body);return card;
}
function drawStore(reset){
  var grid=$('products-grid'),store=ST.data.store||DEFAULT.store;
  if(reset){grid.innerHTML='';ST.shown=0;}
  var next=ST.list.slice(ST.shown,ST.shown+ST.PAGE);
  if(!ST.list.length){grid.innerHTML='<p class="text-gray-500 col-span-full">لا توجد منتجات</p>';}
  next.forEach(function(p,k){grid.append(buildCard(p,ST.shown+k+1,store));});
  ST.shown+=next.length;
  $('moreBtn').classList.toggle('hidden',ST.shown>=ST.list.length);
}
function filterStore(){
  var q=$('search').value.trim().toLowerCase();
  var all=(ST.data.products||[]).slice().reverse(); // الأحدث أولًا
  ST.list=q?all.filter(function(p){return String(p.name).toLowerCase().indexOf(q)>-1;}):all;
  drawStore(true);
}
function initStore(data){
  ST.data=data;filterStore();
  if(!ST.viewed&&window.fbq){fbq('track','ViewContent');ST.viewed=true;}
}
$('search').addEventListener('input',filterStore);
$('moreBtn').addEventListener('click',function(){drawStore(false);});
fetch('products.json?v='+Date.now())
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(initStore)
  .catch(function(){initStore(DEFAULT);});

/* ================= الإدارة ================= */
var S={owner:'',repo:'',token:'',branch:'main',sha:null,data:JSON.parse(JSON.stringify(DEFAULT))};
var AD={shown:15,q:''};
var Q=[];

function show(text,type){var m=$('msg');m.className=type;m.textContent=text;m.style.display='block';if(type==='ok')setTimeout(function(){m.style.display='none';},7000);}
function api(path,opts){
  opts=opts||{};
  opts.headers=Object.assign({'Authorization':'Bearer '+S.token,'Accept':'application/vnd.github+json'},opts.headers||{});
  return fetch('https://api.github.com/repos/'+S.owner+'/'+S.repo+'/contents/'+path,opts);
}
function b64enc(str){var bytes=new TextEncoder().encode(str),bin='';bytes.forEach(function(b){bin+=String.fromCharCode(b);});return btoa(bin);}
function b64dec(b64){var bin=atob(b64.replace(/\n/g,'')),bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder().decode(bytes);}

async function loadProducts(){
  var r=await api('products.json?ref='+S.branch+'&t='+Date.now());
  if(r.status===401)throw new Error('المفتاح غير صحيح أو منتهي');
  if(r.status===404){
    var rr=await fetch('https://api.github.com/repos/'+S.owner+'/'+S.repo,{headers:{'Authorization':'Bearer '+S.token}});
    if(!rr.ok)throw new Error('لم يتم العثور على الـ Repository. تأكد من الاسم والصلاحيات.');
    S.sha=null;S.data=JSON.parse(JSON.stringify(DEFAULT));S.data.products=[];return;
  }
  if(!r.ok)throw new Error('خطأ '+r.status);
  var j=await r.json();S.sha=j.sha;S.data=JSON.parse(b64dec(j.content));
  S.data.store=S.data.store||DEFAULT.store;S.data.products=S.data.products||[];
}
async function saveProducts(message){
  function body(){var b={message:message,content:b64enc(JSON.stringify(S.data,null,1)),branch:S.branch};if(S.sha)b.sha=S.sha;return JSON.stringify(b);}
  var r=await api('products.json',{method:'PUT',body:body()});
  if(r.status===409||r.status===422){var mine=S.data;await loadProducts();S.data=mine;r=await api('products.json',{method:'PUT',body:body()});}
  if(!r.ok)throw new Error('فشل الحفظ ('+r.status+'). تأكد أن المفتاح يملك صلاحية Contents: Read and write');
  var j=await r.json();S.sha=j.content.sha;
}
function compressImage(file){
  return new Promise(function(res,rej){
    var img=new Image(),url=URL.createObjectURL(file);
    img.onload=function(){
      var max=900,k=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.85).split(',')[1]);
    };
    img.onerror=function(){rej(new Error('تعذّر قراءة الصورة'));};
    img.src=url;
  });
}
async function uploadImage(file,n){
  var b64=await compressImage(file),name='images/p_'+Date.now()+'_'+n+'.jpg',r;
  for(var t=0;t<3;t++){
    r=await api(name,{method:'PUT',body:JSON.stringify({message:'Add product image',content:b64,branch:S.branch})});
    if(r.ok)return name;
    if(r.status===401||r.status===404)break;
    await sleep(2500*(t+1)); // تخفيف الضغط ثم إعادة المحاولة
  }
  throw new Error('فشل رفع الصورة ('+r.status+')');
}

/* --- طابور الإضافة الجماعية --- */
function renderQueue(){
  var box=$('queue');box.innerHTML='';
  Q.forEach(function(it,i){
    var row=document.createElement('div');row.className='row';
    var img=document.createElement('img');img.src=it.url;img.alt='';
    var f=document.createElement('div');f.className='f';
    var n=document.createElement('input');n.type='text';n.placeholder='اسم المنتج';n.value=it.name;n.addEventListener('input',function(){it.name=n.value;});
    var p=document.createElement('input');p.type='number';p.step='0.01';p.placeholder='السعر';p.inputMode='decimal';p.value=it.price;p.addEventListener('input',function(){it.price=p.value;});
    f.append(n,p);
    var x=document.createElement('button');x.className='red';x.textContent='إزالة';
    x.addEventListener('click',function(){URL.revokeObjectURL(it.url);Q.splice(i,1);renderQueue();});
    row.append(img,f,x);box.append(row);
  });
  $('addBtn').style.display=Q.length?'block':'none';
  $('addBtn').textContent='رفع ونشر الكل ('+Q.length+')';
}
$('pfiles').addEventListener('change',function(){
  Array.prototype.forEach.call(this.files,function(f){Q.push({file:f,name:'',price:'',url:URL.createObjectURL(f)});});
  this.value='';renderQueue();
});

/* --- عرض وتعديل المنتجات الحالية --- */
function renderAdmin(){
  $('wa').value=(S.data.store&&S.data.store.whatsapp)||'';
  var all=S.data.products,q=AD.q.toLowerCase();
  var items=[];for(var k=all.length-1;k>=0;k--){if(!q||String(all[k].name).toLowerCase().indexOf(q)>-1)items.push(all[k]);}
  $('count').textContent='('+all.length+')';
  var list=$('list');list.innerHTML='';
  if(!items.length){list.textContent='لا توجد منتجات';}
  items.slice(0,AD.shown).forEach(function(p){
    var row=document.createElement('div');row.className='row';
    var img=document.createElement('img');img.src=p.image;img.alt='';img.loading='lazy';
    var f=document.createElement('div');f.className='f';
    var n=document.createElement('input');n.type='text';n.value=p.name;n.addEventListener('input',function(){p.name=n.value;});
    var pr=document.createElement('input');pr.type='number';pr.step='0.01';pr.value=p.price;pr.inputMode='decimal';pr.addEventListener('input',function(){p.price=parseFloat(pr.value)||0;});
    f.append(n,pr);
    var del=document.createElement('button');del.className='red';del.textContent='حذف';
    del.addEventListener('click',async function(){
      if(!confirm('حذف "'+p.name+'" ؟'))return;
      S.data.products.splice(S.data.products.indexOf(p),1);
      await run(function(){return saveProducts('Delete product');},'تم الحذف');
      renderAdmin();
    });
    row.append(img,f,del);list.append(row);
  });
  $('amore').style.display=items.length>AD.shown?'block':'none';
}
$('asearch').addEventListener('input',function(){AD.q=this.value.trim();AD.shown=15;renderAdmin();});
$('amore').addEventListener('click',function(){AD.shown+=15;renderAdmin();});

async function run(fn,okText){
  var btns=document.querySelectorAll('#adminView button');btns.forEach(function(b){b.disabled=true;});
  show('جاري التنفيذ...','info');
  try{await fn();if(okText)show(okText+' — يظهر في الموقع خلال دقيقة تقريبًا','ok');return true;}
  catch(e){show(e.message||'حدث خطأ','err');return false;}
  finally{btns.forEach(function(b){b.disabled=false;});}
}
async function enter(){
  S.owner=$('owner').value.trim();S.repo=$('repo').value.trim();S.token=$('token').value.trim();
  if(!S.token){show('أدخل المفتاح','err');return;}
  var ok=await run(loadProducts,'تم الدخول');
  if(ok){localStorage.setItem('adm',JSON.stringify({o:S.owner,r:S.repo,t:S.token}));$('login').style.display='none';$('panel').style.display='block';renderAdmin();}
}
$('loginBtn').addEventListener('click',enter);
$('logoutBtn').addEventListener('click',function(){localStorage.removeItem('adm');location.reload();});
$('saveBtn').addEventListener('click',function(){
  S.data.store=S.data.store||{};var w=$('wa').value.replace(/\D/g,'');if(w)S.data.store.whatsapp=w;
  run(function(){return saveProducts('Update products');},'تم الحفظ');
});

$('addBtn').addEventListener('click',async function(){
  var uni=$('uprice').value;
  for(var i=0;i<Q.length;i++){
    if(!Q[i].name.trim()){show('المنتج رقم '+(i+1)+' بدون اسم','err');return;}
    if(Q[i].price===''&&uni==='' ){show('المنتج رقم '+(i+1)+' بدون سعر. اكتب سعرًا أو سعرًا موحّدًا','err');return;}
  }
  var total=Q.length,done=0,failed=null;
  var btns=document.querySelectorAll('#adminView button');btns.forEach(function(b){b.disabled=true;});
  try{
    var maxId=S.data.products.reduce(function(m,p){return Math.max(m,Number(p.id)||0);},0);
    while(Q.length){
      var it=Q[0];
      show('جاري رفع '+(done+1)+' من '+total+' ... لا تغلق الصفحة','info');
      var path=await uploadImage(it.file,done);
      var price=parseFloat(it.price===''?uni:it.price)||0;
      S.data.products.push({id:++maxId,name:it.name.trim(),price:price,image:path});
      URL.revokeObjectURL(it.url);Q.shift();done++;
      if(done%10===0){await saveProducts('Add products');}
      await sleep(600);
    }
  }catch(e){failed=e;}
  try{ if(done%10!==0||failed) await saveProducts('Add products'); }catch(e){failed=failed||e;}
  btns.forEach(function(b){b.disabled=false;});
  renderQueue();renderAdmin();
  if(failed)show('تم نشر '+done+' من '+total+'. توقف بسبب: '+failed.message+' — المتبقي ما زال في القائمة، اضغط رفع لإكماله','err');
  else show('تم نشر '+done+' منتج — يظهر في الموقع خلال دقيقة تقريبًا','ok');
});

function route(){
  var admin=location.hash==='#admin';
  $('adminView').style.display=admin?'block':'none';
  $('storeView').style.display=admin?'none':'block';
}
window.addEventListener('hashchange',route);route();
(async function(){
  var saved=localStorage.getItem('adm');if(!saved||location.hash!=='#admin')return;
  try{var s=JSON.parse(saved);S.owner=s.o;S.repo=s.r;S.token=s.t;await loadProducts();$('login').style.display='none';$('panel').style.display='block';renderAdmin();}
  catch(e){localStorage.removeItem('adm');show(e.message,'err');}
})();
</script>

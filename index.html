<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moath Kids - ملابس أطفال</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #f8f9fa; color: #333; padding-bottom: 60px; }
        header { background: #fff; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .logo-area { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 5px; }
        .logo-area img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .logo-area h1 { font-size: 1.2rem; color: #ff4757; }
        .shipping-banner { background: #ff4757; color: #fff; text-align: center; padding: 6px; font-size: 0.85rem; font-weight: bold; }
        .cover-container { width: 100%; max-height: 350px; overflow: hidden; background: #eee; }
        .cover-container img { width: 100%; height: auto; display: block; object-fit: cover; }
        .container { padding: 15px; max-width: 1200px; margin: auto; }
        .search-box { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 25px; font-size: 1rem; outline: none; text-align: center; margin-bottom: 20px; background: #fff; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        .product-info { padding: 10px; text-align: center; }
        .product-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 5px; color: #444; }
        .product-price { color: #ff4757; font-weight: bold; font-size: 0.9rem; margin-bottom: 10px; }
        .btn-buy { background: #2ed573; color: #fff; border: none; padding: 10px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 0 0 12px 12px; font-size: 0.9rem; }
        
        /* لوحة الإدارة */
        .admin-bar { background: #222; color: #fff; padding: 10px; text-align: center; position: fixed; bottom: 0; width: 100%; z-index: 1000; display: flex; justify-content: space-around; align-items: center; }
        .admin-bar button { background: #ff4757; color: #fff; border: none; padding: 6px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .modal-content button { width: 100%; padding: 10px; background: #2ed573; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .modal-content .close-btn { background: #ff4757; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <img src="https://raw.githubusercontent.com/moathkids/moath.kids/main/logo.png" onerror="this.src='https://images.unsplash.com/photo-1519689680058-324335c77eba?w=100'" alt="Logo">
            <h1>معاذ كيدز - Moath Kids</h1>
        </div>
    </header>

    <div class="shipping-banner">
        🚚 رسوم التوصيل للداخل: 60 شيكل
    </div>

    <div class="cover-container">
        <img src="https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=800" alt="الغلاف">
    </div>

    <div class="container">
        <input type="text" class="search-box" id="searchInput" placeholder="ابحث عن منتج..." onkeyup="filterProducts()">
        
        <div class="products-grid" id="productsGrid">
            <!-- المنتجات -->
        </div>
    </div>

    <!-- شريط الإدارة السفلي -->
    <div class="admin-bar">
        <span>لوحة تحكم المتجر</span>
        <button onclick="checkAdmin()">دخول الإدارة ⚙️</button>
    </div>

    <!-- نافذة الإدارة -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h3>إضافة منتج جديد</h3>
            <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">كلمة المرور: 1234</p>
            <input type="text" id="pTitle" placeholder="اسم المنتج (مثلاً: طقم ولادي)">
            <input type="text" id="pPrice" placeholder="السعر (مثلاً: 90 شيكل)">
            <input type="text" id="pImage" placeholder="رابط صورة المنتج المباشر">
            <button onclick="addNewProduct()">حفظ وإضافة المنتج</button>
            <button class="close-btn" onclick="closeAdmin()">إغلاق</button>
        </div>
    </div>

    <script>
        let defaultProducts = [
            {
                title: "طقم كنزة وبنطلون محبوك للأطفال",
                price: "90 شيكل",
                image: "https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?w=500"
            },
            {
                title: "طقم محبوك مضلع خريف وشتاء",
                price: "110 شيكل",
                image: "https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=500"
            }
        ];

        let products = JSON.parse(localStorage.getItem('moath_products')) || defaultProducts;

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach((p) => {
                let whatsappMsg = encodeURIComponent(`مرحباً، أريد طلب هذا المنتج:\n- المنتج: ${p.title}\n- السعر: ${p.price}\n- رسوم التوصيل للداخل: 60 شيكل\n\nيرجى تأكيد الطلب.`);
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1519689680058-324335c77eba?w=500'">
                        <div class="product-info">
                            <div class="product-title">${p.title}</div>
                            <div class="product-price">${p.price}</div>
                            <div style="font-size: 0.75rem; color: #777; margin-bottom: 8px;">التوصيل للداخل: 60 شيكل</div>
                        </div>
                        <a href="https://wa.me/972590000000?text=${whatsappMsg}" target="_blank" style="text-decoration: none;">
                            <button class="btn-buy">أضف للسلة (واتساب)</button>
                        </a>
                    </div>
                `;
            });
        }

        function checkAdmin() {
            let pass = prompt("أدخل كلمة المرور للإدارة:");
            if (pass === "1234") {
                document.getElementById('adminModal').style.display = 'flex';
            } else if (pass !== null) {
                alert("كلمة المرور غير صحيحة!");
            }
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function addNewProduct() {
            let title = document.getElementById('pTitle').value;
            let price = document.getElementById('pPrice').value;
            let image = document.getElementById('pImage').value;

            if(!title || !price || !image) {
                alert("الرجاء تعبئة جميع الحقول!");
                return;
            }

            products.unshift({ title, price, image });
            localStorage.setItem('moath_products', JSON.stringify(products));
            renderProducts();
            closeAdmin();
            alert("تمت إضافة المنتج بنجاح!");
            
            document.getElementById('pTitle').value = '';
            document.getElementById('pPrice').value = '';
            document.getElementById('pImage').value = '';
        }

        function filterProducts() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            let filtered = products.filter(p => p.title.toLowerCase().includes(query));
            
            filtered.forEach((p) => {
                let whatsappMsg = encodeURIComponent(`مرحباً، أريد طلب هذا المنتج:\n- المنتج: ${p.title}\n- السعر: ${p.price}\n- رسوم التوصيل للداخل: 60 شيكل\n\nيرجى تأكيد الطلب.`);
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" alt="${p.title}" onerror="this.src='https://images.unsplash.com/photo-1519689680058-324335c77eba?w=500'">
                        <div class="product-info">
                            <div class="product-title">${p.title}</div>
                            <div class="product-price">${p.price}</div>
                            <div style="font-size: 0.75rem; color: #777; margin-bottom: 8px;">التوصيل للداخل: 60 شيكل</div>
                        </div>
                        <a href="https://wa.me/972590000000?text=${whatsappMsg}" target="_blank" style="text-decoration: none;">
                            <button class="btn-buy">أضف للسلة (واتساب)</button>
                        </a>
                    </div>
                `;
            });
        }

        renderProducts();
    </script>
</body>
</html>
